<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330"
     viewBox="0 0 860 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="28" y="34" font-size="17" font-weight="600" fill="#1b1f23">Mixed-precision error budget, chi = 2 zipper</text>
  <text x="28" y="55" font-size="12.5" fill="#6a737d">Ablation over 200 random bond-dimension-2 MPS of 8 sites. The int8 cores carry the entire loss; the f32 accumulator is free.</text>
  <line x1="425.0" y1="92" x2="425.0" y2="264" stroke="#e6e9ec"/>
  <text x="425.0" y="284" font-size="11" fill="#6a737d" text-anchor="middle">1e-6</text>
  <line x1="508.3" y1="92" x2="508.3" y2="264" stroke="#e6e9ec"/>
  <text x="508.3" y="284" font-size="11" fill="#6a737d" text-anchor="middle">1e-5</text>
  <line x1="591.7" y1="92" x2="591.7" y2="264" stroke="#e6e9ec"/>
  <text x="591.7" y="284" font-size="11" fill="#6a737d" text-anchor="middle">1e-4</text>
  <line x1="675.0" y1="92" x2="675.0" y2="264" stroke="#e6e9ec"/>
  <text x="675.0" y="284" font-size="11" fill="#6a737d" text-anchor="middle">1e-3</text>
  <line x1="758.3" y1="92" x2="758.3" y2="264" stroke="#e6e9ec"/>
  <text x="758.3" y="284" font-size="11" fill="#6a737d" text-anchor="middle">1e-2</text>
  <line x1="841.7" y1="92" x2="841.7" y2="264" stroke="#e6e9ec"/>
  <text x="841.7" y="284" font-size="11" fill="#6a737d" text-anchor="middle">1e-1</text>
  <line x1="300" y1="113.5" x2="770.3" y2="113.5" stroke="#c96a2b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="770.3" cy="113.5" r="5" fill="#c96a2b"/>
  <text x="284" y="117.5" font-size="12" fill="#1b1f23" text-anchor="end">int8 cores — norm drift (worst)</text>
  <text x="782.3" y="117.5" font-size="11" fill="#6a737d">0.0139</text>
  <line x1="300" y1="156.5" x2="707.9" y2="156.5" stroke="#c96a2b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="707.9" cy="156.5" r="5" fill="#c96a2b"/>
  <text x="284" y="160.5" font-size="12" fill="#1b1f23" text-anchor="end">int8 cores — norm drift (mean)</text>
  <text x="719.9" y="160.5" font-size="11" fill="#6a737d">0.00248</text>
  <line x1="300" y1="199.5" x2="583.1" y2="199.5" stroke="#2f6f9f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="583.1" cy="199.5" r="5" fill="#2f6f9f"/>
  <text x="284" y="203.5" font-size="12" fill="#1b1f23" text-anchor="end">int8 cores — 1 − fidelity (worst)</text>
  <text x="595.1" y="203.5" font-size="11" fill="#6a737d">7.9e-05</text>
  <line x1="300" y1="242.5" x2="399.9" y2="242.5" stroke="#3d8b5f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="399.9" cy="242.5" r="5" fill="#3d8b5f"/>
  <text x="284" y="246.5" font-size="12" fill="#1b1f23" text-anchor="end">f32 accumulator — rel. error (worst)</text>
  <text x="411.9" y="246.5" font-size="11" fill="#6a737d">5e-07</text>
  <line x1="300" y1="264" x2="800" y2="264" stroke="#c4cad0"/>
  <text x="800" y="310" font-size="11" fill="#6a737d" text-anchor="end">relative error, log scale — lower is better</text>
</svg>
